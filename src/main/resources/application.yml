server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: student-management-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/student_management?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.example.demo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: mySecretKeyForJwtTokenGeneration2024StudentManagementSystemSecureKeyMustBeLongEnough
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

knife4j:
  enable: true
  setting:
    language: zh_cn
  openapi:
    title: 学生管理系统接口文档
    description: 学生管理系统RESTful API文档
    version: 1.0.0
    contact:
      name: 系统管理员
      email: admin@example.com

logging:
  level:
    root: INFO
    com.example.demo: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
